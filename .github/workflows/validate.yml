name: Baseline validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [app, prototype]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - run: npm ci
      - if: matrix.project == 'app'
        run: npm run lint
      - run: npm run build
      - if: matrix.project == 'app'
        run: npx --no-install astryx doctor --built dist
