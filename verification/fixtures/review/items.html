<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Street Fitting item-mask review</title>
<style>body{font:16px system-ui;max-width:1000px;margin:2rem auto}canvas{max-width:100%;border:1px solid currentColor}label,button,input{font:inherit;margin:.4rem}article{margin:2rem 0}output{white-space:pre-wrap}</style>
<h1>Human item-mask review</h1>
<p>These are AI-authored drafts, not SAM output or human ground truth. Inspect the actual selected region, its bounding box and tap. Approve only usable masks; rejected drafts need corrected masks and regenerated derivatives before review. This local page uploads nothing.</p>
<label>Actual reviewer <input id="reviewer" autocomplete="name"></label>
<section id="items"></section>
<label><input type="checkbox" id="attest">I personally inspected every displayed source and mask. This is actual human review, not AI approval.</label>
<button id="download">Download reviewed item bundle</button><output id="status"></output>
<script type="module">
const $=id=>document.getElementById(id), data=await(await fetch('../masks/items/cases.json')).json(), records=[];
const sha=async bytes=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes)),x=>x.toString(16).padStart(2,'0')).join('');
for(const item of data.candidates){
 const sourceBytes=await(await fetch('../'+item.image)).arrayBuffer(), maskBytes=await(await fetch('../'+item.mask)).arrayBuffer();
 const image=await createImageBitmap(new Blob([sourceBytes])),mask=await createImageBitmap(new Blob([maskBytes]));
 const article=document.createElement('article'),title=document.createElement('h2');title.textContent=item.mask;article.append(title);
 const canvas=document.createElement('canvas');canvas.width=image.width;canvas.height=image.height;const context=canvas.getContext('2d');context.drawImage(image,0,0);
 const layer=document.createElement('canvas');layer.width=mask.width;layer.height=mask.height;const layerContext=layer.getContext('2d');layerContext.drawImage(mask,0,0);const pixels=layerContext.getImageData(0,0,mask.width,mask.height);
 for(let i=0;i<pixels.data.length;i+=4){const selected=pixels.data[i];pixels.data[i]=255;pixels.data[i+1]=0;pixels.data[i+2]=0;pixels.data[i+3]=selected?100:0;}layerContext.putImageData(pixels,0,0);context.drawImage(layer,0,0);
 context.strokeStyle='black';context.lineWidth=2;context.strokeRect(...item.bbox);context.beginPath();context.arc(...item.tap,5,0,Math.PI*2);context.stroke();article.append(canvas);
 const label=document.createElement('label'),checkbox=document.createElement('input');checkbox.type='checkbox';label.append(checkbox,document.createTextNode(' I approve this selected region, box and tap'));article.append(label);$('items').append(article);
 records.push({mask:item.mask,sourceSha256:await sha(sourceBytes),maskSha256:await sha(maskBytes),checkbox});
}
$('download').onclick=()=>{
 const reviewer=$('reviewer').value.trim();if(!reviewer||!$('attest').checked||records.some(r=>!r.checkbox.checked)){$('status').textContent='A real reviewer, explicit attestation and every candidate approval are required.';return;}
 const value={schemaVersion:1,reviewer,reviewedAt:new Date().toISOString(),humanAttestation:true,candidates:records.map(({checkbox,...row})=>({...row,approved:checkbox.checked}))};
 const url=URL.createObjectURL(new Blob([JSON.stringify(value,null,2)],{type:'application/json'}));const link=document.createElement('a');link.href=url;link.download='items.review.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
};
</script></html>
