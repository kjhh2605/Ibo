apply plugin: 'com.android.application'

android {
    namespace = "com.streetfitting.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.streetfitting.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    androidResources { noCompress += 'onnx' }
    sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/sfModels'))
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.5.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-appcheck'
    debugImplementation 'com.google.firebase:firebase-appcheck-debug'
    implementation 'androidx.camera:camera-core:1.5.1'
    implementation 'androidx.camera:camera-camera2:1.5.1'
    implementation 'androidx.camera:camera-lifecycle:1.5.1'
    implementation 'androidx.camera:camera-view:1.5.1'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.22.0'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// Copy only the preserved, verified exports into generated assets.
def modelDir = providers.gradleProperty('SF_MODELS_DIR').orElse(providers.environmentVariable('SF_MODELS_DIR')).orElse("${System.getProperty('user.home')}/.cache/street-fitting/models")
def modelHashes = [
    'edgetam_encoder.onnx': 'b13dd3cc3a60996e9f2a1ef55cdc3b9e70366706bd108d65ed6ea615543c918e',
    'edgetam_decoder.onnx': 'ceaa17668b6bd70fb7d1d79f8b78274d71101696e16ba31eef7ee5d8fef16978',
    'pe_image.onnx': '10b2683490922a82a61ee108673fc94ea455c6ad3996b1f2dc86f93a935d114c'
]
tasks.register('generateSfModelAssets') {
    def output = layout.buildDirectory.dir('generated/sfModels/models')
    inputs.property('modelDir', modelDir)
    modelHashes.keySet().each { name -> inputs.file(modelDir.map { "${it}/${name}" }) }
    outputs.dir(output)
    doLast {
        def dest = output.get().asFile
        dest.mkdirs()
        modelHashes.each { name, expected ->
            def source = file("${modelDir.get()}/${name}")
            if (!source.isFile()) throw new GradleException("Required model missing: ${name}")
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            source.withInputStream { stream -> byte[] buffer = new byte[65536]; int n; while ((n = stream.read(buffer)) != -1) digest.update(buffer, 0, n) }
            def actual = digest.digest().collect { String.format('%02x', it & 0xff) }.join()
            if (actual != expected) throw new GradleException("Model SHA-256 mismatch: ${name}")
            copy { from source; into dest }
        }
        new File(dest, 'manifest.json').text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
            models: [
                [file: 'edgetam_encoder.onnx', sha256: modelHashes['edgetam_encoder.onnx'], input: [1,3,1024,1024]],
                [file: 'edgetam_decoder.onnx', sha256: modelHashes['edgetam_decoder.onnx'], coords: [1,1,2]],
                [file: 'pe_image.onnx', sha256: modelHashes['pe_image.onnx'], input: [1,3,384,384], output: [1,512]]
            ]
        ]))
    }
}
tasks.named('preBuild').configure { dependsOn tasks.named('generateSfModelAssets') }
