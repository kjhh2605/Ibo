[project]
name = "street-fitting-relay"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.10,<3",
  "firebase-admin>=6,<8", "httpx>=0.27,<1", "pillow>=11,<12",
  "torch==2.5.1", "torchvision==0.20.1", "numpy>=2,<3",
  "timm==1.0.15", "einops==0.8.1", "huggingface-hub>=0.26,<1",
  "ftfy>=6,<7", "regex>=2024.0", "safetensors>=0.4,<1"
]
[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = ["."]
